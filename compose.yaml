x-app-environment: &app-environment
  NODE_ENV: production
  SECUREPASS_ORIGIN: https://${SECUREPASS_HOSTNAME:?Set SECUREPASS_HOSTNAME}
  SECUREPASS_DEPLOYMENT_MODE: ${SECUREPASS_DEPLOYMENT_MODE:-isolated}
  SECUREPASS_SITES_FILE: /run/secrets/sites
  SECUREPASS_SECRETS_FILE: /run/secrets/credentials
  SECUREPASS_GATE_DEVICES_FILE: /run/secrets/gates
  SECUREPASS_GATE_ENABLED: ${SECUREPASS_GATE_ENABLED:-false}
  SECUREPASS_COOKIE_SECURE: 'true'
  SECUREPASS_DATA_DIR: /data
  SECUREPASS_JOURNAL_DIR: /privacy-journal
  SECUREPASS_BACKUP_DIR: /backups
  SECUREPASS_BACKUP_POLICY_ACK: ${SECUREPASS_BACKUP_POLICY_ACK:?Review backup policy and set true}
  TRUST_PROXY: '1'

services:
  init-volumes:
    image: securepass:local
    build: .
    user: '0:0'
    entrypoint: ['sh', '-c']
    command: ['chown -R 10001:10001 /data /privacy-journal /backups']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    volumes: ['app-data:/data', 'privacy-journal:/privacy-journal', 'backups:/backups']

  app:
    image: securepass:local
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    environment: *app-environment
    secrets: [credentials, sites, gates]
    volumes: ['app-data:/data', 'privacy-journal:/privacy-journal', 'backups:/backups']
    networks: [backend]
    depends_on:
      init-volumes: { condition: service_completed_successfully }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    environment:
      SECUREPASS_HOSTNAME: ${SECUREPASS_HOSTNAME}
      SECUREPASS_ACME_EMAIL: ${SECUREPASS_ACME_EMAIL:?Set certificate contact email}
    ports: ['80:80', '443:443']
    volumes:
      ['./deploy/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    networks: [edge, backend]
    depends_on:
      app: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  backup:
    image: securepass:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    network_mode: none
    environment: *app-environment
    secrets: [credentials, sites, gates]
    command: ['node', 'ops/backup-loop.mjs']
    volumes: ['app-data:/data:ro', 'privacy-journal:/privacy-journal:ro', 'backups:/backups']
    depends_on:
      app: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

secrets:
  credentials: { file: '${SECUREPASS_PRIVATE_DIR:-./.private}/secrets.json' }
  sites: { file: '${SECUREPASS_PRIVATE_DIR:-./.private}/sites.json' }
  gates: { file: '${SECUREPASS_PRIVATE_DIR:-./.private}/gate-devices.json' }

volumes:
  app-data:
  privacy-journal:
  backups:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend: { internal: true }
